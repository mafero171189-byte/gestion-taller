<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow">
<title>Programa · Mi Taller Web</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#06122a; color:#e8ecf1; font-family: system-ui, Segoe UI, Arial, sans-serif; line-height:1.55; }
  a { color:#7cc4ff; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:14px 22px; border-bottom:1px solid #15294d; }
  .top .brand { font-weight:800; color:#fff; text-decoration:none; }
  .top .volver { color:#9fc2e8; font-weight:600; font-size:14px; text-decoration:none; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 22px; }
  .head { display:flex; gap:14px; align-items:center; margin: 34px 0 8px; }
  .head .ico { font-size:40px; }
  h1 { font-size: 30px; margin: 0; }
  .meta { color:#8fa3bf; font-size:13px; margin-bottom:18px; }
  .lead { color:#cfdcec; font-size:17px; margin: 0 0 24px; }
  .shot { background:#0e1d3a; border:1px solid #1e4d8c; border-radius:14px; padding:10px; margin-bottom:12px; }
  .shot img { width:100%; display:block; border-radius:8px; }
  .card { background:#0e1d3a; border:1px solid #1e4d8c; border-radius:14px; padding:20px; margin-bottom:16px; }
  .card h2 { font-size:18px; margin:0 0 10px; color:#fff; }
  ul, ol { padding-left:20px; color:#cfdcec; margin:0; }
  li { margin-bottom:7px; }
  .btn { display:inline-block; padding:13px 22px; border-radius:10px; font-weight:800; text-decoration:none; margin:4px 6px 4px 0; font-size:15px; }
  .btn-main { background:#1e9e53; color:#fff; }
  .btn-sec { background:#1e4d8c; color:#fff; }
  .compra { background:linear-gradient(180deg,#0f2244,#0b1a36); border:1px solid #2a6bc0; border-radius:18px; padding:22px; margin-bottom:16px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .compra h2 { margin:0 0 4px; font-size:20px; color:#fff; }
  .compra .sub { color:#8fa3bf; font-size:13px; margin-bottom:16px; }
  .planes { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:16px; }
  .plan { position:relative; background:#0a1730; border:1px solid #1e3a66; border-radius:14px; padding:16px 16px 14px; }
  .plan.dest { border-color:#38bdf8; background:linear-gradient(180deg,#0e2a52,#0a1730); box-shadow:0 0 0 1px rgba(56,189,248,.3); }
  .plan .nom { font-size:12px; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; color:#7cc4ff; margin-bottom:10px; }
  .plan .tag { position:absolute; top:-10px; right:12px; background:#1e9e53; color:#fff; font-size:11px; font-weight:800; padding:3px 10px; border-radius:20px; }
  .plan .p { display:flex; align-items:baseline; gap:6px; margin:2px 0; color:#fff; }
  .plan .p b { font-size:26px; font-weight:800; letter-spacing:-.5px; }
  .plan .p span { font-size:13px; color:#8fa3bf; font-weight:600; }
  .plan .p small { margin-left:auto; font-size:11px; font-weight:800; color:#9fc2e8; background:#15294d; border-radius:6px; padding:2px 7px; }
  .alias { display:flex; align-items:center; gap:10px; background:#0a1730; border:1px dashed #2a6bc0; border-radius:12px; padding:10px 12px; margin:8px 0; }
  .alias span { color:#8fa3bf; font-size:13px; white-space:nowrap; }
  .alias b { font-size:16px; color:#fff; word-break:break-all; }
  .alias button { margin-left:auto; background:#1e4d8c; color:#fff; border:0; border-radius:8px; padding:8px 14px; font-weight:700; cursor:pointer; }
  .btn[aria-disabled="true"] { background:#2a3a55; color:#8fa3bf; pointer-events:none; }
  .note { background:#16232f; border-left:3px solid #f0a93b; padding:10px 14px; border-radius:8px; color:#e8d9b5; font-size:14px; margin-top:12px; }
  .vacio { color:#8fa3bf; padding: 40px 0; text-align:center; }
  .foot { text-align:center; color:#6b7f9e; font-size:13px; padding: 26px 0 40px; border-top:1px solid #15294d; margin-top:30px; }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="/">📱 Mi Taller Web</a>
  <a class="volver" href="/extras">← Volver a Extras</a>
</header>

<main class="wrap" id="contenido">
  <div class="vacio">Cargando…</div>
</main>

<footer class="foot">Mi Taller Web · Extras</footer>

<script>
function copiarAlias(b,id){ var t=document.getElementById(id).textContent; var ok=function(){b.textContent='¡Copiado!';setTimeout(function(){b.textContent='Copiar';},2000);}; if(navigator.clipboard){navigator.clipboard.writeText(t).then(ok,ok);}else{ok();} }
(async () => {
  const cont = document.getElementById('contenido');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const id = new URLSearchParams(location.search).get('id') || '';
  try {
    const r = await fetch('/programas.json', { cache: 'no-store' });
    const programas = await r.json();
    const p = programas.find((x) => x.id === id);
    if (!p) { cont.innerHTML = '<div class="vacio">No encontramos ese programa. <a href="/extras">Ver todos los extras</a></div>'; return; }

    document.title = esc(p.nombre) + ' · Mi Taller Web';
    const shots = (p.capturas || []).map((s) => `<div class="shot"><img src="${esc(s)}" alt="${esc(p.nombre)}"></div>`).join('');
    const funciones = (p.funciones || []).map((x) => `<li>${esc(x)}</li>`).join('');
    const pasos = (p.pasos || []).map((x) => `<li>${esc(x)}</li>`).join('');
    const requisitos = (p.requisitos || []).map((x) => `<li>${esc(x)}</li>`).join('');
    const tieneUrl = !!p.url;
    // Precio, alias y WhatsApp se administran desde Mi Taller Web > Precios de Extras
    const FB = 'https://github-c3e96-default-rtdb.firebaseio.com/configuracion/sistema/';
    const leer = (n) => fetch(FB + n + '.json').then((x) => x.json()).catch(() => null);
    const [precios, alias, waNum] = await Promise.all([leer('extrasPrecios'), leer('extrasAlias'), leer('soporteWhatsapp')]);
    const num = String(waNum || '5491135654094').replace(/\D/g, '');
    const x = (precios && precios[p.id]) || {};
    const al = alias || {};
    const fmt = (v) => { const n = Number(String(v).replace(/\./g, '').replace(',', '.')); return isFinite(n) && /^[\d.,\s]+$/.test(String(v)) ? n.toLocaleString('es-AR') : String(v); };
    const periodos = [['', 'Pago único', ''], ['Mensual', 'Mensual', '/ mes'], ['Anual', 'Anual', '/ año']]
      .map(([k, nom, suf]) => ({ k, nom, suf, ars: x['ars' + k] || '', usd: x['usd' + k] || '' }))
      .filter((o) => o.ars || o.usd);
    // Ahorro del plan anual vs 12 meses
    const num0 = (v) => Number(String(v).replace(/\./g, '').replace(',', '.'));
    const m = periodos.find((o) => o.k === 'Mensual'), an = periodos.find((o) => o.k === 'Anual');
    let ahorro = 0;
    if (m && an) { const par = m.ars && an.ars ? [num0(m.ars), num0(an.ars)] : (m.usd && an.usd ? [num0(m.usd), num0(an.usd)] : null); if (par && par[0] > 0 && par[1] > 0 && par[1] < par[0] * 12) ahorro = Math.round((1 - par[1] / (par[0] * 12)) * 100); }
    const esPago = periodos.length > 0;
    const dias = p.dias_prueba || p.diasPrueba || '';
    const hayArs = periodos.some((o) => o.ars), hayUsd = periodos.some((o) => o.usd);
    const precio = periodos.map((o) => o.nom + ': ' + [o.ars ? '$ ' + o.ars : '', o.usd ? 'US$ ' + o.usd : ''].filter(Boolean).join(' / ') + (o.suf ? ' ' + o.suf : '')).join(' | ');
    const wa = 'https://wa.me/' + num + '?text=' + encodeURIComponent(p.whatsapp_texto || ('Hola, quiero info sobre ' + p.nombre));
    const waCompra = 'https://wa.me/' + num + '?text=' + encodeURIComponent('Hola! Quiero comprar la licencia de ' + p.nombre + ' (' + precio + '). Quiero coordinar el pago.');

    cont.innerHTML = `
      <div class="head"><div class="ico">${esc(p.icono || '🧩')}</div><h1>${esc(p.nombre)}</h1></div>
      <div class="meta">${p.version ? 'Versión ' + esc(p.version) : ''}${p.tamano ? ' · ' + esc(p.tamano) : ''} · Windows</div>
      <p class="lead">${esc(p.descripcion || p.resumen)}</p>

      ${shots}

      <div class="card">
        <h2>Descarga</h2>
        <a class="btn btn-main" href="${tieneUrl ? esc(p.url) : '#'}" ${tieneUrl ? 'target="_blank" rel="noopener"' : ''} aria-disabled="${tieneUrl ? 'false' : 'true'}">${tieneUrl ? '⬇️ Descargar' : '⏳ Próximamente'}</a>
        ${p.guia ? `<a class="btn btn-sec" href="${esc(p.guia)}" target="_blank" rel="noopener">📄 Guía de uso (PDF)</a>` : ''}
        ${esPago ? `<div class="note" style="border-left-color:#1e9e53;background:#10261d;color:#cfe9d8;">✅ La descarga es <b>gratis</b>. Lo que se paga es la <b>licencia</b> para activar el programa.${dias ? ` Incluye <b>${esc(dias)} días de prueba</b> para que lo pruebes antes de comprar.` : ''}</div>` : ''}
        <div class="note">Como el programa todavía no tiene firma digital, Windows puede mostrar un aviso azul la primera vez. Tocá <b>Más información</b> y después <b>Ejecutar de todas formas</b>.</div>
      </div>

      ${esPago ? `<div class="compra">
        <h2>Comprar licencia de ${esc(p.nombre)}</h2>
        <div class="sub">Elegí tu plan de licencia y pagá por transferencia.</div>
        <div class="planes">
        ${periodos.map((o) => `<div class="plan ${o.k === 'Anual' && ahorro ? 'dest' : ''}">
          ${o.k === 'Anual' && ahorro ? `<div class="tag">Ahorrás ${ahorro}%</div>` : ''}
          <div class="nom">Licencia ${o.nom.toLowerCase()}</div>
          ${o.ars ? `<div class="p"><b>$ ${esc(fmt(o.ars))}</b><span>${o.suf}</span><small>ARS</small></div>` : ''}
          ${o.usd ? `<div class="p"><b>US$ ${esc(fmt(o.usd))}</b><span>${o.suf}</span><small>USD</small></div>` : ''}
        </div>`).join('')}
        </div>
        ${hayArs && al.ars ? `<div class="alias"><span>Alias pesos</span><b id="aliasArs">${esc(al.ars)}</b><button type="button" onclick="copiarAlias(this,'aliasArs')">Copiar</button></div>` : ''}
        ${hayUsd && al.usd ? `<div class="alias"><span>Alias dólares</span><b id="aliasUsd">${esc(al.usd)}</b><button type="button" onclick="copiarAlias(this,'aliasUsd')">Copiar</button></div>` : ''}
        <a class="btn btn-main" href="${waCompra}" target="_blank" rel="noopener">💬 Comprar licencia por WhatsApp</a>
        <div class="note">Después de pagar, mandanos el comprobante por WhatsApp y te pasamos el código de activación de tu licencia.</div>
      </div>` : ''}

      ${funciones ? `<div class="card"><h2>¿Qué hace?</h2><ul>${funciones}</ul></div>` : ''}
      ${pasos ? `<div class="card"><h2>Cómo se usa</h2><ol>${pasos}</ol></div>` : ''}
      ${requisitos ? `<div class="card"><h2>Antes de empezar</h2><ul>${requisitos}</ul></div>` : ''}

      <div class="card">
        <h2>¿Tenés dudas?</h2>
        <a class="btn btn-sec" href="${wa}" target="_blank" rel="noopener">💬 Consultar por WhatsApp</a>
      </div>`;
  } catch {
    cont.innerHTML = '<div class="vacio">No se pudo cargar el programa. Probá de nuevo en un momento.</div>';
  }
})();
</script>
</body>
</html>
