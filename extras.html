<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow">
<title>Extras · Mi Taller Web</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#06122a; color:#e8ecf1; font-family: system-ui, Segoe UI, Arial, sans-serif; line-height:1.55;
         background-image: linear-gradient(rgba(30,77,140,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(30,77,140,.07) 1px, transparent 1px); background-size:48px 48px; }
  a { color:inherit; text-decoration:none; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:14px 22px; border-bottom:1px solid #15294d; background:rgba(6,18,42,.85); }
  .top .brand { font-weight:800; color:#fff; }
  .top .volver { color:#9fc2e8; font-weight:600; font-size:14px; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  h1 { font-size: 30px; margin: 36px 0 6px; }
  .sub { color:#b7c6da; margin: 0 0 26px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:20px; padding-bottom:40px; }
  .card { position:relative; display:flex; flex-direction:column; background:linear-gradient(180deg,#0e1d3a,#0a1730); border:1px solid #1b3a6b; border-radius:18px; overflow:hidden; transition: transform .18s, border-color .18s, box-shadow .18s; }
  .card:hover { transform: translateY(-4px); border-color:#38bdf8; box-shadow:0 12px 32px rgba(0,0,0,.45), 0 0 0 1px rgba(56,189,248,.25); }
  .shot { position:relative; height:170px; background:linear-gradient(135deg,#12305e,#0a1a38 60%,#1e4d8c); overflow:hidden; }
  .shot img.cap { width:100%; height:100%; object-fit:cover; display:block; }
  .shot::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,transparent 55%,rgba(10,23,48,.85)); pointer-events:none; }
  .badge { position:absolute; right:14px; bottom:12px; z-index:2; padding:4px 14px; border-radius:20px; font-size:11px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; background:rgba(8,20,45,.85); border:1px solid #1e4d8c; color:#38bdf8; }
  .badge.plus { color:#e0a060; border-color:#a0653a; }
  .badge.ultra { color:#f0c850; border-color:#b8922a; }
  .ico { position:relative; z-index:3; width:72px; height:72px; margin:-36px 0 0 18px; border-radius:20px; background:#0b1a36; border:2px solid #15294d; display:flex; align-items:center; justify-content:center; font-size:38px; overflow:hidden; box-shadow:0 6px 18px rgba(0,0,0,.4); }
  .ico img { width:100%; height:100%; object-fit:cover; }
  .body { padding:12px 18px 18px; display:flex; flex-direction:column; flex:1; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .card h2 { font-size:20px; margin:0; color:#fff; font-weight:800; }
  .ver { background:#15294d; border:1px solid #1e3a66; border-radius:8px; padding:2px 10px; font-size:13px; font-weight:700; color:#cfe0f5; white-space:nowrap; }
  .card p { margin:10px 0 16px; color:#9fb2cc; font-size:14.5px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; flex:1; }
  .btn { display:block; text-align:center; padding:12px; border-radius:10px; font-weight:800; font-size:15px; color:#fff; background:linear-gradient(180deg,#1e5aa8,#174a8c); border:1px solid #2a6bc0; }
  .card:hover .btn { background:linear-gradient(180deg,#2467b8,#1b559f); }
  .meta { color:#8fa3bf; font-size:12px; margin-top:8px; text-align:center; min-height:1em; }
  .vacio { color:#8fa3bf; padding: 30px 0; grid-column:1/-1; }
  .foot { text-align:center; color:#6b7f9e; font-size:13px; padding: 26px 0 40px; border-top:1px solid #15294d; }
  @media (max-width:520px){ .grid{ grid-template-columns:1fr; } .shot{ height:150px; } }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="/">📱 Mi Taller Web</a>
  <a class="volver" href="/">← Volver al inicio</a>
</header>

<main class="wrap">
  <h1>Extras</h1>
  <p class="sub">Programas útiles para tu celular y tu PC. Tocá uno para ver la información y descargarlo.</p>
  <div class="grid" id="lista"><div class="vacio">Cargando…</div></div>
</main>

<footer class="foot">Mi Taller Web · Extras</footer>

<script>
(async () => {
  const lista = document.getElementById('lista');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  try {
    const r = await fetch('/programas.json', { cache: 'no-store' });
    const programas = await r.json();
    if (!programas.length) { lista.innerHTML = '<div class="vacio">Todavía no hay programas publicados.</div>'; return; }
    const esc2 = (u) => esc(u);
    const first = (v) => Array.isArray(v) ? first(v[0]) : (v && typeof v === 'object' ? (v.url || v.src || v.imagen || v.ruta || '') : v);
    const KEYS = ['imagen','captura','screenshot','portada','miniatura','thumb','thumbnail','foto','imagenPrincipal','capturas','screenshots','imagenes','imágenes','fotos','galeria','galería','gallery','images','img','preview'];
    const pickImg = (p) => { for (const k of KEYS) { const v = first(p[k]); if (v && typeof v === 'string' && v !== p.icono) return v; } return p._cap || ''; };
    const esUrl = (v) => /^(https?:|\/|data:|\.\/)/i.test(String(v || ''));
        // Precios (los carga el admin desde Mi Taller Web > Precios de Extras)
    let precios = {};
    try { const rp = await fetch('https://github-c3e96-default-rtdb.firebaseio.com/configuracion/sistema/extrasPrecios.json'); const j = await rp.json(); if (j && typeof j === 'object') precios = j; } catch {}
    // Respaldo: si el JSON no trae foto, la busco en la página del programa
    await Promise.all(programas.map(async (p) => {
      if (pickImg(p)) return;
      try {
        const h = await (await fetch('/programa?id=' + encodeURIComponent(p.id))).text();
        const d = new DOMParser().parseFromString(h, 'text/html');
        const og = d.querySelector('meta[property="og:image"]');
        let u = og && og.content;
        if (!u) { const im = [...d.querySelectorAll('img')].map((i) => i.getAttribute('src')).find((x) => x && !/icon|logo|favicon/i.test(x)); u = im; }
        if (u) p._cap = new URL(u, location.origin + '/').href;
      } catch {}
    }));
    lista.innerHTML = programas.map((p) => {
      const cap = pickImg(p);
      const ic = p.icono || '🧩';
      const pr = precios[p.id] && precios[p.id].precio ? String(precios[p.id].precio).trim() : '';
      const esGratis = !pr || /^gratis$/i.test(pr);
      const plan = esGratis ? 'Gratis' : (/^[\d.,\s]+$/.test(pr) ? '$ ' + pr : pr);
      const pl = plan.toLowerCase();
      const cls = esGratis ? '' : 'plus';
      return `
      <a class="card" href="/programa?id=${encodeURIComponent(p.id)}">
        <div class="shot">${esUrl(cap) ? `<img class="cap" loading="lazy" src="${esc2(cap)}" alt="" onerror="this.remove()">` : ''}<span class="badge ${cls}">${esc(plan)}</span></div>
        <div class="ico">${esUrl(ic) ? `<img src="${esc2(ic)}" alt="">` : esc(ic)}</div>
        <div class="body">
          <div class="row"><h2>${esc(p.nombre)}</h2>${p.version ? `<span class="ver">${esc(p.version)}</span>` : ''}</div>
          <p>${esc(p.resumen)}</p>
          <span class="btn">Ver información</span>
          <div class="meta">${p.tamano ? esc(p.tamano) : ''}</div>
        </div>
      </a>`;
    }).join('');
  } catch {
    lista.innerHTML = '<div class="vacio">No se pudo cargar el listado. Probá de nuevo en un momento.</div>';
  }
})();
</script>
</body>
</html>
