<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow">
<title>Extras · Mi Taller Web</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#06122a; color:#e8ecf1; font-family: system-ui, Segoe UI, Arial, sans-serif; line-height:1.55; }
  a { color:inherit; text-decoration:none; }
  .top { display:flex; justify-content:space-between; align-items:center; padding:14px 22px; border-bottom:1px solid #15294d; }
  .top .brand { font-weight:800; color:#fff; }
  .top .volver { color:#9fc2e8; font-weight:600; font-size:14px; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 22px; }
  h1 { font-size: 30px; margin: 36px 0 6px; }
  .sub { color:#b7c6da; margin: 0 0 26px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap:16px; padding-bottom:40px; }
  .card { background:#0e1d3a; border:1px solid #1e4d8c; border-radius:14px; padding:20px; display:block; transition: transform .15s, border-color .15s; }
  .card:hover { transform: translateY(-2px); border-color:#38bdf8; }
  .card .ico { font-size:30px; }
  .card h2 { font-size:18px; margin:8px 0 6px; color:#fff; }
  .card p { margin:0 0 10px; color:#b7c6da; font-size:14px; }
  .card .meta { color:#8fa3bf; font-size:12px; }
  .vacio { color:#8fa3bf; padding: 30px 0; }
  .foot { text-align:center; color:#6b7f9e; font-size:13px; padding: 26px 0 40px; border-top:1px solid #15294d; }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="/">📱 Mi Taller Web</a>
  <a class="volver" href="/">← Volver al inicio</a>
</header>

<main class="wrap">
  <h1>Extras</h1>
  <p class="sub">Programas útiles para tu celular y tu PC. Tocá uno para ver la información y descargarlo.</p>
  <div class="grid" id="lista"><div class="vacio">Cargando…</div></div>
</main>

<footer class="foot">Mi Taller Web · Extras</footer>

<script>
(async () => {
  const lista = document.getElementById('lista');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  try {
    const r = await fetch('/programas.json', { cache: 'no-store' });
    const programas = await r.json();
    if (!programas.length) { lista.innerHTML = '<div class="vacio">Todavía no hay programas publicados.</div>'; return; }
    lista.innerHTML = programas.map((p) => `
      <a class="card" href="/programa?id=${encodeURIComponent(p.id)}">
        <div class="ico">${esc(p.icono || '🧩')}</div>
        <h2>${esc(p.nombre)}</h2>
        <p>${esc(p.resumen)}</p>
        <div class="meta">${p.version ? 'Versión ' + esc(p.version) : ''}${p.tamano ? ' · ' + esc(p.tamano) : ''}</div>
      </a>`).join('');
  } catch {
    lista.innerHTML = '<div class="vacio">No se pudo cargar el listado. Probá de nuevo en un momento.</div>';
  }
})();
</script>
</body>
</html>
