<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Generar licencias · Virus Killer Mobile</title>
<style>
  :root { color-scheme: dark; }
  * { -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:#06122a; color:#e8ecf1; font-family: system-ui, Segoe UI, Arial, sans-serif; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 14px; color:#fff; }
  h2 { font-size: 15px; margin: 22px 0 10px; color:#9fc2e8; }
  .card { background:#0e1d3a; border:1px solid #1e4d8c; border-radius:12px; padding:14px; }
  label { display:block; font-size:12px; color:#9fc2e8; margin:10px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:11px; border-radius:8px; border:1px solid #38455a; background:#0a1630; color:#fff; font-size:16px; }
  input:focus { outline:2px solid #2f7fd6; outline-offset:0; }
  input.bad { border-color:#ff6b7f; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; min-width:0; }
  button { width:100%; margin-top:14px; padding:13px; border:0; border-radius:10px; background:#1e9e53; color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
  button.sec { background:#1e4d8c; margin-top:8px; }
  button.wa { background:#128c4a; margin-top:8px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { width:auto; margin:0; padding:7px 12px; font-size:13px; font-weight:600; background:#16315c; border:1px solid #1e4d8c; border-radius:16px; }
  .chip.on { background:#1e4d8c; border-color:#4a8fd8; }
  textarea { width:100%; box-sizing:border-box; min-height:110px; margin-top:10px; padding:10px; border-radius:8px; border:1px solid #38455a; background:#0a1630; color:#4fc77d; font-family: Consolas, monospace; font-size:12px; word-break: break-all; }
  .msg { margin-top:10px; font-size:14px; min-height:18px; }
  .err { color:#ff6b7f; } .ok { color:#4fc77d; } .warn { color:#ffc857; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid #1c2c4d; vertical-align:top; }
  th { color:#9fc2e8; font-weight:600; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:700; }
  .vig { background:#1e9e53; color:#fff; } .venc { background:#9c2b3d; color:#fff; } .pronto { background:#b8860b; color:#fff; }
  .small { font-size:12px; color:#8fa3bf; }
  .copy { width:auto; padding:6px 10px; margin:0 4px 4px 0; font-size:12px; }
  .acts { white-space:nowrap; }
  .filters { display:flex; gap:6px; margin-top:10px; }
  details { margin-top:14px; }
  summary { font-size:12px; color:#8fa3bf; cursor:pointer; }
  @media (max-width: 480px) { th:nth-child(4), td:nth-child(4) { display:none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Generar licencia · Virus Killer Mobile</h1>

  <form id="f" class="card" autocomplete="off" novalidate>
    <label for="fp">ID de equipo del cliente</label>
    <input id="fp" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="ej. 4NE5R-T4ZNM-CMEAX-2MUMP-QSBAW-A">
    <div class="row">
      <div>
        <label for="name">Nombre del cliente</label>
        <input id="name" autocomplete="off" placeholder="Juan Pérez">
      </div>
      <div>
        <label for="dur">Duración</label>
        <input id="dur" value="30d" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="7d, 2w, 3m, 1y">
      </div>
    </div>
    <div class="chips" id="chips">
      <button type="button" class="chip" data-d="7d">7 días</button>
      <button type="button" class="chip on" data-d="30d">30 días</button>
      <button type="button" class="chip" data-d="3m">3 meses</button>
      <button type="button" class="chip" data-d="6m">6 meses</button>
      <button type="button" class="chip" data-d="1y">1 año</button>
    </div>
    <button id="gen" type="submit">Generar licencia</button>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
    <textarea id="out" readonly placeholder="Acá aparece el token para enviarle al cliente"></textarea>
    <div class="row">
      <button id="copy" type="button" class="sec" disabled>Copiar token</button>
      <button id="wa" type="button" class="wa" disabled>Enviar por WhatsApp</button>
    </div>
  </form>

  <h2>Historial</h2>
  <div class="card">
    <form id="sf" class="row" style="align-items:stretch" novalidate>
      <input id="q" placeholder="Buscar por cliente o ID de equipo" autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="find" type="submit" class="sec" style="flex:0 0 auto;width:auto;margin:0;padding:0 18px">Buscar</button>
    </form>
    <div class="filters">
      <button type="button" class="chip on" data-f="all">Todas</button>
      <button type="button" class="chip" data-f="vig">Vigentes</button>
      <button type="button" class="chip" data-f="venc">Vencidas</button>
    </div>
    <div id="hist" style="margin-top:12px"></div>
    <button id="more" type="button" class="sec" style="display:none">Ver más</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (s) => new Date(s * 1000).toLocaleDateString("es-AR");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const PAGE = 20;
const FP_RE = /^[A-Z0-9]+(-[A-Z0-9]+)+$/;
const DUR_RE = /^\d{1,4}[dwmy]$/;

let rowsAll = [];
let filter = "all";
let shown = PAGE;
let histReq = 0;
let lastIssued = null;

/* ---------- storage seguro ---------- */
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

/* ---------- API ---------- */
async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  let r;
  try { r = await fetch(path, { ...opts, headers }); }
  catch { throw new Error("Sin conexión con el servidor."); }
  let d = null;
  try { d = await r.json(); } catch {}
  if (!r.ok) {
    if (r.status === 401 || r.status === 403) throw new Error((d && d.error) || "No autorizado (" + r.status + ").");
    throw new Error((d && d.error) || "Error del servidor (" + r.status + ").");
  }
  if (d === null) throw new Error("Respuesta inválida del servidor (" + r.status + ").");
  return d;
}

/* ---------- helpers ---------- */
function setMsg(text, cls = "") { const m = $("msg"); m.className = "msg " + cls; m.textContent = text; }

function normFp(v) { return String(v || "").replace(/[\s​-‍﻿]+/g, "").replace(/[–—−]/g, "-").toUpperCase(); }

async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    } catch {}
  }
  if (btn) {
    const old = btn.dataset.label || btn.textContent;
    btn.dataset.label = old;
    btn.textContent = ok ? "¡Copiado!" : "No se pudo copiar";
    setTimeout(() => { btn.textContent = old; }, 1600);
  }
  return ok;
}

function daysLeft(venceSec) { return Math.ceil((venceSec * 1000 - Date.now()) / 86400000); }

function estado(x) {
  const d = daysLeft(x.vence);
  const vigente = x.vigente !== undefined ? !!x.vigente : d > 0;
  if (!vigente) return { cls: "venc", txt: "vencida", sub: "venció hace " + Math.max(1, -d) + " d" };
  if (d <= 7) return { cls: "pronto", txt: "vigente", sub: d <= 1 ? "vence hoy/mañana" : "vence en " + d + " d" };
  return { cls: "vig", txt: "vigente", sub: "vence en " + d + " d" };
}

function waLink(name, vence, token) {
  const t = `Hola${name ? " " + name : ""}! Tu licencia de Virus Killer Mobile está lista (vence el ${fmt(vence)}).\n\nCopiá este código y pegalo en la app:\n\n${token}`;
  return "https://wa.me/?text=" + encodeURIComponent(t);
}

/* ---------- duración rápida ---------- */
function syncChips() {
  const v = $("dur").value.trim().toLowerCase();
  document.querySelectorAll("#chips .chip").forEach((c) => c.classList.toggle("on", c.dataset.d === v));
}
$("chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  $("dur").value = b.dataset.d; $("dur").classList.remove("bad"); syncChips();
});
$("dur").addEventListener("input", syncChips);
$("fp").addEventListener("input", () => $("fp").classList.remove("bad"));
$("fp").addEventListener("blur", () => { $("fp").value = normFp($("fp").value); });
$("fp").addEventListener("paste", () => setTimeout(() => { $("fp").value = normFp($("fp").value); }, 0));

/* ---------- generar ---------- */
$("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const fp = normFp($("fp").value);
  const name = $("name").value.trim();
  const dur = $("dur").value.trim().toLowerCase();
  $("fp").value = fp; $("dur").value = dur;

  if (!FP_RE.test(fp) || fp.length < 12 || fp.length > 80) {
    $("fp").classList.add("bad"); $("fp").focus();
    return setMsg("El ID de equipo no tiene un formato válido. Revisá que esté completo.", "err");
  }
  if (!DUR_RE.test(dur)) {
    $("dur").classList.add("bad"); $("dur").focus();
    return setMsg("Duración inválida. Usá por ejemplo 7d, 2w, 3m o 1y.", "err");
  }
  if (!name) { $("name").focus(); return setMsg("Poné el nombre del cliente.", "err"); }

  $("gen").disabled = true;
  setMsg("Verificando…");
  try {
    // Aviso si ya hay una licencia vigente para este equipo
    try {
      const prev = await api("/api/history?q=" + encodeURIComponent(fp));
      const activa = Array.isArray(prev) ? prev.find((x) => x.fingerprint === fp && estado(x).txt === "vigente") : null;
      if (activa && !confirm(`Este equipo ya tiene una licencia vigente (${activa.cliente}, vence ${fmt(activa.vence)}).\n\n¿Generar otra igual?`)) {
        setMsg("Cancelado: ya tenía licencia vigente.", "warn");
        return;
      }
    } catch {}

    setMsg("Generando…");
    const d = await api("/api/issue", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ fingerprint: fp, name, duration: dur }),
    });
    if (!d.token) throw new Error("El servidor no devolvió el token.");
    lastIssued = d;
    $("out").value = d.token;
    $("copy").disabled = false;
    $("wa").disabled = false;
    setMsg(`Licencia lista para ${d.cliente}. Vence ${fmt(d.vence)}.`, "ok");
    loadHistory();
  } catch (e) {
    setMsg(e.message, "err");
  } finally { $("gen").disabled = false; }
});

$("copy").onclick = async () => {
  const ok = await copyText($("out").value, $("copy"));
  setMsg(ok ? "Token copiado." : "No se pudo copiar. Mantené apretado el texto y copialo a mano.", ok ? "ok" : "err");
};
$("wa").onclick = () => {
  if (!lastIssued) return;
  window.open(waLink(lastIssued.cliente, lastIssued.vence, lastIssued.token), "_blank", "noopener");
};

/* ---------- historial ---------- */
function filtered() {
  if (filter === "all") return rowsAll;
  return rowsAll.filter((x) => (estado(x).txt === "vigente") === (filter === "vig"));
}

function renderHistory() {
  const list = filtered();
  if (!list.length) { $("hist").innerHTML = '<div class="small">Sin resultados.</div>'; $("more").style.display = "none"; return; }
  const vis = list.slice(0, shown);
  $("hist").innerHTML = "<table><tr><th>Cliente</th><th>Equipo</th><th>Vence</th><th>Duración</th><th></th></tr>" +
    vis.map((x) => {
      const e = estado(x);
      const i = rowsAll.indexOf(x);
      return `<tr>
        <td>${esc(x.cliente)}<div class="small">${fmt(x.emitida)}</div></td>
        <td class="small">${esc(x.fingerprint)}</td>
        <td>${fmt(x.vence)} <span class="tag ${e.cls}">${e.txt}</span><div class="small">${esc(e.sub)}</div></td>
        <td>${esc(x.duracion)}</td>
        <td class="acts">
          <button type="button" class="sec copy" data-a="copy" data-i="${i}">Copiar</button>
          <button type="button" class="wa copy" data-a="wa" data-i="${i}">WhatsApp</button>
          <button type="button" class="sec copy" data-a="renew" data-i="${i}">Renovar</button>
        </td>
      </tr>`;
    }).join("") + "</table>" +
    `<div class="small" style="margin-top:8px">Mostrando ${vis.length} de ${list.length}</div>`;
  $("more").style.display = list.length > shown ? "block" : "none";
}

$("hist").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-a]"); if (!b) return;
  const x = rowsAll[Number(b.dataset.i)]; if (!x) return;
  if (b.dataset.a === "copy") copyText(x.token, b);
  else if (b.dataset.a === "wa") window.open(waLink(x.cliente, x.vence, x.token), "_blank", "noopener");
  else if (b.dataset.a === "renew") {
    $("fp").value = x.fingerprint; $("name").value = x.cliente;
    $("dur").value = DUR_RE.test(String(x.duracion || "").toLowerCase()) ? String(x.duracion).toLowerCase() : "30d";
    syncChips(); $("fp").classList.remove("bad");
    setMsg("Datos cargados para renovar. Revisá la duración y generá.", "ok");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

$("more").onclick = () => { shown += PAGE; renderHistory(); };

document.querySelectorAll(".filters .chip").forEach((b) => b.addEventListener("click", () => {
  filter = b.dataset.f; shown = PAGE;
  document.querySelectorAll(".filters .chip").forEach((c) => c.classList.toggle("on", c === b));
  renderHistory();
}));

async function loadHistory() {
  const my = ++histReq;                       // evita que una respuesta vieja pise a la nueva
  const q = $("q").value.trim();
  $("hist").textContent = "Cargando…";
  $("more").style.display = "none";
  try {
    const rows = await api("/api/history?q=" + encodeURIComponent(q) + "&limit=200");
    if (my !== histReq) return;
    rowsAll = Array.isArray(rows) ? rows : [];
    shown = PAGE;
    renderHistory();
  } catch (e) {
    if (my !== histReq) return;
    $("hist").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}
$("sf").addEventListener("submit", (e) => { e.preventDefault(); loadHistory(); });
syncChips();
loadHistory();
</script>
</body>
</html>
