<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Generar licencias · Virus Killer Mobile</title>
<style>
  :root { color-scheme: dark; }
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html, body { max-width: 100%; overflow-x: hidden; }
  body { margin:0; background:#06122a; color:#e8ecf1; font-family: system-ui, Segoe UI, Arial, sans-serif; }
  .wrap { max-width: 680px; margin: 0 auto; padding: 16px; width: 100%; }
  h1 { font-size: 20px; margin: 8px 0 14px; color:#fff; }
  h2 { font-size: 15px; margin: 22px 0 10px; color:#9fc2e8; }
  .card { background:#0e1d3a; border:1px solid #1e4d8c; border-radius:12px; padding:14px; width:100%; min-width:0; }
  label { display:block; font-size:12px; color:#9fc2e8; margin:10px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:11px; border-radius:8px; border:1px solid #38455a; background:#0a1630; color:#fff; font-size:16px; }
  input:focus { outline:2px solid #2f7fd6; outline-offset:0; }
  input.bad { border-color:#ff6b7f; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; min-width:0; }
  button { width:100%; margin-top:14px; padding:13px; border:0; border-radius:10px; background:#1e9e53; color:#fff; font-size:16px; font-weight:700; cursor:pointer; }
  button.sec { background:#1e4d8c; margin-top:8px; }
  button.wa { background:#128c4a; margin-top:8px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .chip { width:auto; margin:0; padding:7px 12px; font-size:13px; font-weight:600; background:#16315c; border:1px solid #1e4d8c; border-radius:16px; }
  .chip.on { background:#1e4d8c; border-color:#4a8fd8; }
  textarea { width:100%; box-sizing:border-box; min-height:110px; margin-top:10px; padding:10px; border-radius:8px; border:1px solid #38455a; background:#0a1630; color:#4fc77d; font-family: Consolas, monospace; font-size:12px; word-break: break-all; }
  .msg { margin-top:10px; font-size:14px; min-height:18px; overflow-wrap:anywhere; }
  .err { color:#ff6b7f; } .ok { color:#4fc77d; } .warn { color:#ffc857; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:700; }
  .vig { background:#1e9e53; color:#fff; } .venc { background:#9c2b3d; color:#fff; } .pronto { background:#b8860b; color:#fff; }
  .small { font-size:12px; color:#8fa3bf; }
  .filters { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }

  /* Historial en formato tarjeta (sin tabla, no se desborda) */
  .item { padding:12px 0; border-bottom:1px solid #1c2c4d; min-width:0; }
  .item:last-child { border-bottom:0; }
  .item-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .item-top > div { min-width:0; }
  .item-name { font-weight:700; font-size:15px; overflow-wrap:anywhere; }
  .item-right { text-align:right; flex:0 0 auto; }
  .item-fp { font-size:12px; color:#8fa3bf; margin-top:6px; word-break:break-all; font-family: Consolas, monospace; }
  .item-meta { font-size:12px; color:#8fa3bf; margin-top:4px; }
  .item-acts { display:flex; gap:6px; margin-top:10px; }
  .resumen { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .rbox { background:#0a1630; border:1px solid #1e4d8c; border-radius:10px; padding:9px 6px; text-align:center; }
  .rbox b { display:block; font-size:20px; color:#fff; }
  .rbox span { font-size:11px; color:#8fa3bf; }
  .rbox.g b { color:#4fc77d; } .rbox.y b { color:#ffc857; } .rbox.r b { color:#ff6b7f; }
  .modal { position:fixed; inset:0; background:rgba(2,8,20,.78); display:none; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal.on { display:flex; }
  .mbox { background:#0e1d3a; border:1px solid #2f7fd6; border-radius:14px; padding:18px; max-width:380px; width:100%; }
  .mbox h3 { margin:0 0 8px; font-size:16px; color:#fff; }
  .mbox p { margin:0; font-size:14px; line-height:1.45; color:#cfd9e8; white-space:pre-line; overflow-wrap:anywhere; }
  .mbox .row button { margin-top:16px; }
  .item-acts button { flex:1; min-width:0; width:auto; margin:0; padding:9px 4px; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Generar licencia · Virus Killer Mobile</h1>

  <form id="f" class="card" autocomplete="off" novalidate>
    <label for="fp">ID de equipo del cliente</label>
    <input id="fp" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="ej. 4NE5R-T4ZNM-CMEAX-2MUMP-QSBAW-A">
    <div class="row">
      <div>
        <label for="name">Nombre del cliente</label>
        <input id="name" autocomplete="off" placeholder="Juan Pérez">
      </div>
      <div>
        <label for="dur">Duración</label>
        <input id="dur" value="30d" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="7d, 2w, 3m, 1y">
      </div>
    </div>
    <label for="phone">WhatsApp del cliente (opcional, con código de país)</label>
    <input id="phone" type="tel" inputmode="numeric" autocomplete="off" placeholder="ej. 5491122334455">
    <div class="chips" id="chips">
      <button type="button" class="chip" data-d="7d">7 días</button>
      <button type="button" class="chip on" data-d="30d">30 días</button>
      <button type="button" class="chip" data-d="3m">3 meses</button>
      <button type="button" class="chip" data-d="6m">6 meses</button>
      <button type="button" class="chip" data-d="1y">1 año</button>
    </div>
    <button id="gen" type="submit">Generar licencia</button>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
    <textarea id="out" readonly placeholder="Acá aparece el token para enviarle al cliente"></textarea>
    <div class="row">
      <button id="copy" type="button" class="sec" disabled>Copiar token</button>
      <button id="copyMsg" type="button" class="sec" disabled>Copiar mensaje</button>
    </div>
    <button id="wa" type="button" class="wa" disabled>Enviar por WhatsApp</button>
  </form>

  <h2>Historial</h2>
  <div class="card">
    <form id="sf" class="row" style="align-items:stretch" novalidate>
      <input id="q" placeholder="Buscar por cliente o ID de equipo" autocomplete="off" autocorrect="off" spellcheck="false">
      <button id="find" type="submit" class="sec" style="flex:0 0 auto;width:auto;margin:0;padding:0 18px">Buscar</button>
    </form>
    <div id="resumen" class="resumen"></div>
    <div class="filters">
      <button type="button" class="chip on" data-f="all">Todas</button>
      <button type="button" class="chip" data-f="vig">Vigentes</button>
      <button type="button" class="chip" data-f="pronto">Por vencer</button>
      <button type="button" class="chip" data-f="venc">Vencidas</button>
    </div>
    <div id="hist" style="margin-top:12px"></div>
    <button id="more" type="button" class="sec" style="display:none">Ver más</button>
  </div>
</div>

<div id="modal" class="modal" role="dialog" aria-modal="true">
  <div class="mbox">
    <h3 id="mTitle">Confirmar</h3>
    <p id="mText"></p>
    <div class="row">
      <button id="mNo" type="button" class="sec">Cancelar</button>
      <button id="mYes" type="button">Aceptar</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (s) => new Date(s * 1000).toLocaleDateString("es-AR");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const PAGE = 20;
const FP_RE = /^[A-Z0-9]+(-[A-Z0-9]+)+$/;
const DUR_RE = /^\d{1,4}[dwmy]$/;

let rowsAll = [];
let filter = "all";
let shown = PAGE;
let histReq = 0;
let lastIssued = null;

/* ---------- storage seguro ---------- */
const store = {
  get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};

/* ---------- teléfonos de clientes (guardados solo en este navegador) ---------- */
function phonesGet() { try { return JSON.parse(store.get("vk_phones") || "{}") || {}; } catch { return {}; } }
function phoneOf(fp) { return phonesGet()[fp] || ""; }
function phoneSave(fp, ph) {
  const d = String(ph || "").replace(/\D/g, "");
  const m = phonesGet();
  if (d) m[fp] = d; else delete m[fp];
  store.set("vk_phones", JSON.stringify(m));
}

/* ---------- confirmación con estilo (reemplaza confirm()) ---------- */
function askConfirm(title, text, yesTxt = "Aceptar") {
  return new Promise((resolve) => {
    $("mTitle").textContent = title; $("mText").textContent = text; $("mYes").textContent = yesTxt;
    const m = $("modal"); m.classList.add("on");
    const done = (v) => { m.classList.remove("on"); $("mYes").onclick = $("mNo").onclick = null; m.onclick = null; resolve(v); };
    $("mYes").onclick = () => done(true);
    $("mNo").onclick = () => done(false);
    m.onclick = (e) => { if (e.target === m) done(false); };
  });
}

/* ---------- API ---------- */
async function api(path, opts = {}) {
  const headers = { ...(opts.headers || {}) };
  let r;
  try { r = await fetch(path, { ...opts, headers }); }
  catch { throw new Error("Sin conexión con el servidor."); }
  let d = null;
  try { d = await r.json(); } catch {}
  if (!r.ok) {
    if (r.status === 401 || r.status === 403) throw new Error((d && d.error) || "No autorizado (" + r.status + ").");
    throw new Error((d && d.error) || "Error del servidor (" + r.status + ").");
  }
  if (d === null) throw new Error("Respuesta inválida del servidor (" + r.status + ").");
  return d;
}

/* ---------- helpers ---------- */
function setMsg(text, cls = "") { const m = $("msg"); m.className = "msg " + cls; m.textContent = text; }

function normFp(v) { return String(v || "").replace(/[\s​-‍﻿]+/g, "").replace(/[–—−]/g, "-").toUpperCase(); }

async function copyText(text, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.focus(); ta.select();
      ok = document.execCommand("copy");
      document.body.removeChild(ta);
    } catch {}
  }
  if (btn) {
    const old = btn.dataset.label || btn.textContent;
    btn.dataset.label = old;
    btn.textContent = ok ? "¡Copiado!" : "No se pudo copiar";
    setTimeout(() => { btn.textContent = old; }, 1600);
  }
  return ok;
}

function daysLeft(venceSec) { return Math.ceil((venceSec * 1000 - Date.now()) / 86400000); }

function estado(x) {
  const d = daysLeft(x.vence);
  const vigente = x.vigente !== undefined ? !!x.vigente : d > 0;
  if (!vigente) return { cls: "venc", txt: "vencida", sub: "venció hace " + Math.max(1, -d) + " d" };
  if (d <= 7) return { cls: "pronto", txt: "vigente", sub: d <= 1 ? "vence hoy/mañana" : "vence en " + d + " d" };
  return { cls: "vig", txt: "vigente", sub: "vence en " + d + " d" };
}

function msgText(name, vence, token) {
  return `Hola${name ? " " + name : ""}! Tu licencia de Virus Killer Mobile está lista (vence el ${fmt(vence)}).\n\nCopiá este código y pegalo en la app:\n\n${token}`;
}
function waLink(name, vence, token, fp) {
  const t = msgText(name, vence, token);
  const ph = fp ? phoneOf(fp) : "";
  return "https://wa.me/" + ph + "?text=" + encodeURIComponent(t);
}

/* ---------- duración rápida ---------- */
function syncChips() {
  const v = $("dur").value.trim().toLowerCase();
  document.querySelectorAll("#chips .chip").forEach((c) => c.classList.toggle("on", c.dataset.d === v));
}
$("chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  $("dur").value = b.dataset.d; $("dur").classList.remove("bad"); syncChips();
});
$("dur").addEventListener("input", syncChips);
$("fp").addEventListener("input", () => $("fp").classList.remove("bad"));
$("fp").addEventListener("blur", () => { $("fp").value = normFp($("fp").value); });
$("fp").addEventListener("paste", () => setTimeout(() => { $("fp").value = normFp($("fp").value); }, 0));

/* ---------- generar ---------- */
$("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const fp = normFp($("fp").value);
  const name = $("name").value.trim();
  const dur = $("dur").value.trim().toLowerCase();
  $("fp").value = fp; $("dur").value = dur;

  if (!FP_RE.test(fp) || fp.length < 12 || fp.length > 80) {
    $("fp").classList.add("bad"); $("fp").focus();
    return setMsg("El ID de equipo no tiene un formato válido. Revisá que esté completo.", "err");
  }
  if (!DUR_RE.test(dur)) {
    $("dur").classList.add("bad"); $("dur").focus();
    return setMsg("Duración inválida. Usá por ejemplo 7d, 2w, 3m o 1y.", "err");
  }
  if (!name) { $("name").focus(); return setMsg("Poné el nombre del cliente.", "err"); }

  $("gen").disabled = true;
  setMsg("Verificando…");
  try {
    // Aviso si ya hay una licencia vigente para este equipo
    try {
      const prev = await api("/api/history?q=" + encodeURIComponent(fp));
      const activa = Array.isArray(prev) ? prev.find((x) => x.fingerprint === fp && estado(x).txt === "vigente") : null;
      if (activa && !(await askConfirm("Ya tiene licencia vigente", `Este equipo ya tiene una licencia vigente (${activa.cliente}, vence ${fmt(activa.vence)}).\n\n¿Generar otra igual?`, "Generar igual"))) {
        setMsg("Cancelado: ya tenía licencia vigente.", "warn");
        return;
      }
    } catch {}

    setMsg("Generando…");
    const d = await api("/api/issue", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ fingerprint: fp, name, duration: dur }),
    });
    if (!d.token) throw new Error("El servidor no devolvió el token.");
    lastIssued = d; lastIssued._fp = fp;
    phoneSave(fp, $("phone").value);
    $("out").value = d.token;
    $("copy").disabled = false;
    $("wa").disabled = false; $("copyMsg").disabled = false;
    setMsg(`Licencia lista para ${d.cliente}. Vence ${fmt(d.vence)}.`, "ok");
    loadHistory();
  } catch (e) {
    setMsg(e.message, "err");
  } finally { $("gen").disabled = false; }
});

$("copy").onclick = async () => {
  const ok = await copyText($("out").value, $("copy"));
  setMsg(ok ? "Token copiado." : "No se pudo copiar. Mantené apretado el texto y copialo a mano.", ok ? "ok" : "err");
};
$("copyMsg").onclick = async () => {
  if (!lastIssued) return;
  const ok = await copyText(msgText(lastIssued.cliente, lastIssued.vence, lastIssued.token), $("copyMsg"));
  setMsg(ok ? "Mensaje copiado, listo para pegar." : "No se pudo copiar el mensaje.", ok ? "ok" : "err");
};
$("wa").onclick = () => {
  if (!lastIssued) return;
  window.open(waLink(lastIssued.cliente, lastIssued.vence, lastIssued.token, lastIssued.fingerprint || lastIssued._fp), "_blank", "noopener");
};

/* ---------- historial ---------- */
function filtered() {
  if (filter === "all") return rowsAll;
  if (filter === "pronto") return rowsAll.filter((x) => estado(x).cls === "pronto");
  return rowsAll.filter((x) => (estado(x).txt === "vigente") === (filter === "vig"));
}

function renderResumen() {
  let v = 0, p = 0, x = 0;
  rowsAll.forEach((r) => { const e = estado(r); if (e.txt !== "vigente") x++; else { v++; if (e.cls === "pronto") p++; } });
  $("resumen").innerHTML =
    `<div class="rbox g"><b>${v}</b><span>vigentes</span></div>` +
    `<div class="rbox y"><b>${p}</b><span>vencen en 7 d</span></div>` +
    `<div class="rbox r"><b>${x}</b><span>vencidas</span></div>`;
}

function renderHistory() {
  renderResumen();
  const list = filtered();
  if (!list.length) { $("hist").innerHTML = '<div class="small">Sin resultados.</div>'; $("more").style.display = "none"; return; }
  const vis = list.slice(0, shown);
  $("hist").innerHTML = vis.map((x) => {
      const e = estado(x);
      const i = rowsAll.indexOf(x);
      return `<div class="item">
        <div class="item-top">
          <div>
            <div class="item-name">${esc(x.cliente)}</div>
            <div class="item-meta">Emitida ${fmt(x.emitida)} · ${esc(x.duracion)}</div>
          </div>
          <div class="item-right">
            <div>${fmt(x.vence)} <span class="tag ${e.cls}">${e.txt}</span></div>
            <div class="item-meta">${esc(e.sub)}</div>
          </div>
        </div>
        <div class="item-fp">${esc(x.fingerprint)}</div>
        <div class="item-acts">
          <button type="button" class="sec" data-a="copy" data-i="${i}">Token</button>
          <button type="button" class="sec" data-a="msg" data-i="${i}">Mensaje</button>
          <button type="button" class="wa" data-a="wa" data-i="${i}">WhatsApp</button>
          <button type="button" class="sec" data-a="renew" data-i="${i}">Renovar</button>
        </div>
      </div>`;
    }).join("") +
    `<div class="small" style="margin-top:8px">Mostrando ${vis.length} de ${list.length}</div>`;
  $("more").style.display = list.length > shown ? "block" : "none";
}

$("hist").addEventListener("click", (ev) => {
  const b = ev.target.closest("button[data-a]"); if (!b) return;
  const x = rowsAll[Number(b.dataset.i)]; if (!x) return;
  if (b.dataset.a === "copy") copyText(x.token, b);
  else if (b.dataset.a === "msg") copyText(msgText(x.cliente, x.vence, x.token), b);
  else if (b.dataset.a === "wa") window.open(waLink(x.cliente, x.vence, x.token, x.fingerprint), "_blank", "noopener");
  else if (b.dataset.a === "renew") {
    $("fp").value = x.fingerprint; $("name").value = x.cliente;
    $("dur").value = DUR_RE.test(String(x.duracion || "").toLowerCase()) ? String(x.duracion).toLowerCase() : "30d";
    $("phone").value = phoneOf(x.fingerprint);
    syncChips(); $("fp").classList.remove("bad");
    setMsg("Datos cargados para renovar. Revisá la duración y generá.", "ok");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
});

$("more").onclick = () => { shown += PAGE; renderHistory(); };

document.querySelectorAll(".filters .chip").forEach((b) => b.addEventListener("click", () => {
  filter = b.dataset.f; shown = PAGE;
  document.querySelectorAll(".filters .chip").forEach((c) => c.classList.toggle("on", c === b));
  renderHistory();
}));

async function loadHistory() {
  const my = ++histReq;                       // evita que una respuesta vieja pise a la nueva
  const q = $("q").value.trim();
  $("hist").textContent = "Cargando…";
  $("more").style.display = "none";
  try {
    const rows = await api("/api/history?q=" + encodeURIComponent(q) + "&limit=200");
    if (my !== histReq) return;
    rowsAll = Array.isArray(rows) ? rows : [];
    shown = PAGE;
    renderHistory();
  } catch (e) {
    if (my !== histReq) return;
    $("hist").innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}
$("sf").addEventListener("submit", (e) => { e.preventDefault(); loadHistory(); });
let qTimer = null;
$("q").addEventListener("input", () => { clearTimeout(qTimer); qTimer = setTimeout(loadHistory, 350); });
syncChips();
loadHistory();
</script>
</body>
</html>
