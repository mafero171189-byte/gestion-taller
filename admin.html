<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Generar licencias · Mi Taller Web</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#06122a; color:#e8ecf1; font-family: system-ui, Segoe UI, Arial, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 14px; color:#fff; }
  h2 { font-size: 15px; margin: 22px 0 10px; color:#9fc2e8; }
  .card { background:#0e1d3a; border:1px solid #1e4d8c; border-radius:12px; padding:14px; }
  label { display:block; font-size:12px; color:#9fc2e8; margin:10px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:11px; border-radius:8px; border:1px solid #38455a; background:#0a1630; color:#fff; font-size:16px; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  button { width:100%; margin-top:14px; padding:13px; border:0; border-radius:10px; background:#1e9e53; color:#fff; font-size:16px; font-weight:700; }
  button.sec { background:#1e4d8c; margin-top:8px; }
  button:disabled { opacity:.5; }
  textarea { width:100%; box-sizing:border-box; min-height:110px; margin-top:10px; padding:10px; border-radius:8px; border:1px solid #38455a; background:#0a1630; color:#4fc77d; font-family: Consolas, monospace; font-size:12px; word-break: break-all; }
  .msg { margin-top:10px; font-size:14px; }
  .err { color:#ff6b7f; } .ok { color:#4fc77d; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid #1c2c4d; vertical-align:top; }
  th { color:#9fc2e8; font-weight:600; }
  .tag { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:700; }
  .vig { background:#1e9e53; color:#fff; } .venc { background:#9c2b3d; color:#fff; }
  .small { font-size:12px; color:#8fa3bf; }
  .copy { width:auto; padding:6px 10px; margin:0; font-size:12px; }
  @media (max-width: 480px) { th:nth-child(4), td:nth-child(4) { display:none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Generar licencia · USB Tester</h1>

  <div class="card">
    <label for="fp">ID de equipo del cliente</label>
    <input id="fp" autocomplete="off" autocapitalize="characters" placeholder="ej. 4NE5R-T4ZNM-CMEAX-2MUMP-QSBAW-A">
    <div class="row">
      <div>
        <label for="name">Nombre del cliente</label>
        <input id="name" placeholder="Juan Pérez">
      </div>
      <div>
        <label for="dur">Duración</label>
        <input id="dur" value="30d" placeholder="7d, 2w, 3m, 1y">
      </div>
    </div>
    <button id="gen">Generar licencia</button>
    <div id="msg" class="msg"></div>
    <textarea id="out" readonly placeholder="Acá aparece el token para enviarle al cliente"></textarea>
    <button id="copy" class="sec" disabled>Copiar token</button>
  </div>

  <h2>Historial</h2>
  <div class="card">
    <input id="q" placeholder="Buscar por cliente o ID de equipo">
    <button id="find" class="sec">Buscar</button>
    <div id="hist" style="margin-top:12px"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (s) => new Date(s * 1000).toLocaleDateString("es-AR");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

$("gen").onclick = async () => {
  const msg = $("msg"); msg.className = "msg"; msg.textContent = "Generando…";
  $("gen").disabled = true;
  try {
    const r = await fetch("/api/issue", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ fingerprint: $("fp").value, name: $("name").value, duration: $("dur").value }),
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "Error al generar.");
    $("out").value = d.token;
    $("copy").disabled = false;
    msg.className = "msg ok";
    msg.textContent = `Licencia lista para ${d.cliente}. Vence ${fmt(d.vence)}.`;
    loadHistory();
  } catch (e) {
    msg.className = "msg err"; msg.textContent = e.message;
  } finally { $("gen").disabled = false; }
};

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("out").value); $("msg").className = "msg ok"; $("msg").textContent = "Token copiado."; }
  catch { $("out").select(); document.execCommand("copy"); }
};

async function loadHistory() {
  const q = $("q").value.trim();
  $("hist").textContent = "Cargando…";
  try {
    const r = await fetch("/api/history?q=" + encodeURIComponent(q));
    const rows = await r.json();
    if (!r.ok) throw new Error(rows.error || "Error");
    if (!rows.length) { $("hist").innerHTML = '<div class="small">Sin resultados.</div>'; return; }
    $("hist").innerHTML = "<table><tr><th>Cliente</th><th>Equipo</th><th>Vence</th><th>Duración</th><th></th></tr>" +
      rows.map((x) => `<tr>
        <td>${esc(x.cliente)}<div class="small">${fmt(x.emitida)}</div></td>
        <td class="small">${esc(x.fingerprint)}</td>
        <td>${fmt(x.vence)} <span class="tag ${x.vigente ? "vig" : "venc"}">${x.vigente ? "vigente" : "vencida"}</span></td>
        <td>${esc(x.duracion)}</td>
        <td><button class="sec copy" onclick="navigator.clipboard.writeText(this.dataset.t)" data-t="${esc(x.token)}">Copiar</button></td>
      </tr>`).join("") + "</table>";
  } catch (e) { $("hist").innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
$("find").onclick = loadHistory;
loadHistory();
</script>
</body>
</html>
